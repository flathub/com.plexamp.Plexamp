name: Check for updates
on:
  schedule: # for scheduling to work this file must be in the default branch
  - cron: "0 * * * *" # run every hour
  workflow_dispatch: # can be manually dispatched under GitHub's "Actions" tab 

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        branch: [ master, beta ] # list all branches to check
    
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          # email sets "github-actions[bot]" as commit author, see https://github.community/t/github-actions-bot-email-address/17204/6
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork com.plexamp.Plexamp.yaml
  # Merge what the checker opened, once Flathub's builder has passed it.
  #
  # Without this the checker does all the work and then waits on a human to
  # press a button, which is a chore that gets forgotten. A PR whose build
  # failed simply stays open, which is the right outcome: the check is the
  # gate, not the click.
  auto-merge:
    needs: flatpak-external-data-checker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge checker PRs whose build has passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list --author app/github-actions --state open --json number --jq '.[].number'); do
            # Merge only when every reported check has passed AND git can still
            # apply the PR. Two ways that goes wrong, both of which mean "leave it
            # for the next run" rather than "fail the run":
            #   - an empty rollup: the build has not reported yet.
            #   - CONFLICTING: the base branch moved on underneath a stale PR. Its
            #     check result can still say SUCCESS while describing a manifest
            #     the branch no longer resembles, so the checks alone are not
            #     enough of a gate. UNKNOWN means GitHub has not worked the
            #     mergeability out yet, and is equally a reason to wait.
            states="$(gh pr view "$pr" --json statusCheckRollup \
                        --jq '[.statusCheckRollup[].state // .statusCheckRollup[].conclusion] | unique | join(",")')"
            # GitHub computes mergeability lazily, so the first read of a fresh
            # PR is usually UNKNOWN and the answer lands a moment later. Ask a few
            # times rather than writing it off: this job runs hourly, and treating
            # "not computed yet" as "not mergeable" would delay every routine
            # update by a full cycle.
            for _ in 1 2 3; do
              mergeable="$(gh pr view "$pr" --json mergeable --jq '.mergeable')"
              [ "$mergeable" != "UNKNOWN" ] && break
              sleep 5
            done
            echo "PR #$pr checks: ${states:-none yet}, mergeable: $mergeable"
            if [ "$states" = "SUCCESS" ] && [ "$mergeable" = "MERGEABLE" ]; then
              # Tolerate a merge that fails anyway (a race with a push to the base,
              # a protected-branch rule). One unmergeable PR must not abort the
              # loop and leave the ones behind it unmerged.
              if gh pr merge "$pr" --squash --delete-branch; then
                echo "merged #$pr"
              else
                echo "could not merge #$pr; leaving it open"
              fi
            fi
          done
