app-id: com.plexamp.Plexamp

runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: startplexamp
separate-locales: false

finish-args:
  - --socket=pulseaudio
  - --socket=x11
  - --share=ipc
  - --share=network
  - --device=dri # Needed for GPU acceleration
  - --own-name=org.mpris.MediaPlayer2.Plexamp

modules:
  - name: Plexamp
    buildsystem: simple
    build-commands:
      - chmod +x Plexamp.AppImage
      - ./Plexamp.AppImage --appimage-extract
      - desktop-file-edit --set-key="Exec" --set-value="startplexamp %U" --set-icon=${FLATPAK_ID}
        --remove-key="X-AppImage-Version" squashfs-root/plexamp.desktop
      - install -D squashfs-root/plexamp.desktop /app/share/applications/com.plexamp.Plexamp.desktop
      - install -D squashfs-root/plexamp.svg /app/share/icons/hicolor/scalable/apps/com.plexamp.Plexamp.svg
      - install -D com.plexamp.Plexamp.metainfo.xml -t /app/share/metainfo/
      - install -Dm755 startplexamp /app/bin/startplexamp
      # Seem to be leftovers from the build system:
      - find squashfs-root -depth \( -name .deps -o -name obj.target \) -exec rm -rfv
        '{}' \;
      # Move everything else:
      - mv squashfs-root /app/bin/plexamp

    sources:
      - type: file
        path: startplexamp

      - type: file
        path: com.plexamp.Plexamp.metainfo.xml

      - type: file
        url: https://plexamp.plex.tv/plexamp.plex.tv/desktop/Plexamp-4.13.1-beta.1.AppImage
        dest-filename: Plexamp.AppImage
        sha512: 354188dfc7640eed9c4e3bd5a3b01b91565c4640b6e098ffaa1bf9da5c015777907d33e5055ff7e8857b4547cf053ab6b7f635c5d3f8ad680e8071d9a788363f
        only-arches: [x86_64]
        x-checker-data:
          is-main-source: true
          type: electron-updater
          url: https://plexamp.plex.tv/plexamp.plex.tv/desktop/beta-linux.yml
