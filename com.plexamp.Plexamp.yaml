# Flathub manifest for Plexamp (the Tauri desktop app, 4.50+).
#
# Mirrors ../com.plexamp.Plexamp.yml, which builds the self-hosted bundle from
# the deb payload in CI. Flathub cannot see that payload, so this one takes the
# released AppImage, the same bytes every AppImage user runs, and installs the
# app-specific parts of it into the GNOME runtime. WebKitGTK, GTK and friends
# come from the runtime rather than the AppImage's bundled copies.
#
# Flathub's beta and master branches both use this file, and both track our
# STABLE releases: x-checker-data reads plexamp.plex.tv/desktop/tauri-update.json,
# the manifest the in-app stable channel follows, so the external-data-checker
# opens a PR on each stable desktop release. Our own -beta.N builds are internal
# and never reach Flathub. The Flathub beta branch exists so Flatpak users can
# opt into the Tauri app while the stable listing still serves 4.13; once that
# has settled, the same file goes to master and stable follows stable.
#
# Only this file and flathub.json live here. The AppStream metainfo the build
# installs is maintained in the Flathub repo beside it, NOT the 19-line stub at
# ../com.plexamp.Plexamp.metainfo.xml that the self-hosted bundle uses: the
# Flathub one carries the branding, the fourteen screenshots and the release
# history that flathub.org renders, so copying ours over would strip the listing
# bare. Add a <release> entry there when the pinned version moves.
app-id: com.plexamp.Plexamp

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: Plexamp
separate-locales: false

finish-args:
  # fallback-x11 rather than x11: Flathub's linter refuses both sockets at
  # once, and the fallback form hands out X11 only when there is no Wayland
  # display to use instead.
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # /dev/snd: direct ALSA output to a DAC, the Linux counterpart of exclusive-
  # mode WASAPI. Without it BASS only sees the PipeWire and Pulse plugins.
  - --device=all
  - --share=ipc
  - --share=network
  # Named destinations instead of --socket=session-bus, which the linter counts
  # as arbitrary D-Bus access. Everything Plexamp does on the session bus is one
  # of these three:
  #   the XDG notification service, which src/notify.rs calls directly;
  #   MPRIS, where souvlaki registers org.mpris.MediaPlayer2.<dbus_name> and our
  #   dbus_name is "plexamp", so the name is lower-case (the capitalised
  #   spelling that used to sit here matched nothing, which went unnoticed
  #   because full session-bus access made owning the right name moot);
  - --talk-name=org.freedesktop.Notifications
  - --own-name=org.mpris.MediaPlayer2.plexamp
  #
  # Single instance needs no grant, but only because the app cooperates. The
  # plugin would otherwise own <bundle identifier>.SingleInstance, and
  # tv.plex.plexamp sits outside this app id's namespace, which Flathub's linter
  # rejects outright and no finish-arg can buy back. From 4.50.12 the app names
  # that service after FLATPAK_ID instead, giving
  # com.plexamp.Plexamp.SingleInstance, a subname of the app id that the sandbox
  # grants by default. Pinning anything older costs single instance and any
  # plexamp:// link trying to reach a running app.
  # ptrace inside the sandbox. Plexamp's audio engine is native C++ and its
  # crash reporter is an out-of-process minidump writer (a child of the app),
  # which needs to ptrace-attach to the crashed parent. The default seccomp
  # filter refuses that, so a Flatpak crash report arrives with a module list
  # and no thread stacks, which makes native crashes on Flatpak undiagnosable.
  # The only thing this exposes is ptrace between Plexamp's own processes.
  - --allow=devel

modules:
  - name: plexamp
    buildsystem: simple
    build-commands:
      - chmod +x Plexamp.AppImage
      - ./Plexamp.AppImage --appimage-extract

      # Binary
      - install -Dm755 squashfs-root/usr/bin/Plexamp /app/bin/Plexamp

      # Native audio libraries (TREBLE + BASS) and the CA bundle TREBLE reads.
      # The AppImage tooling rewrote the binary's RUNPATH to $ORIGIN/../lib, so
      # the libraries it links against must sit in /app/lib; the BASS plug-ins
      # are found by path in /app/lib/plexamp. Same double layout the AppImage
      # itself carries. libjack.so.0, which libtreble needs, comes from the
      # runtime's pipewire-jack.
      - mkdir -p /app/lib/plexamp
      - install -Dm755 squashfs-root/usr/lib/plexamp/*.so /app/lib/plexamp/
      - |
        for lib in libtreble libbass libbassmix libbass_fx libbassenc; do
          install -Dm755 squashfs-root/usr/lib/plexamp/$lib.so /app/lib/$lib.so
        done
      - install -Dm644 squashfs-root/usr/lib/Plexamp/cacert.pem /app/lib/Plexamp/cacert.pem

      # Desktop file, renamed to the reverse-DNS id and pointed at that icon.
      - |
        sed -e 's|^Icon=Plexamp|Icon=com.plexamp.Plexamp|' \
            squashfs-root/usr/share/applications/Plexamp.desktop \
            > com.plexamp.Plexamp.desktop
        install -Dm644 com.plexamp.Plexamp.desktop /app/share/applications/com.plexamp.Plexamp.desktop

      # Icons
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/32x32/apps/Plexamp.png
        /app/share/icons/hicolor/32x32/apps/com.plexamp.Plexamp.png
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/128x128/apps/Plexamp.png
        /app/share/icons/hicolor/128x128/apps/com.plexamp.Plexamp.png
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/256x256@2/apps/Plexamp.png
        /app/share/icons/hicolor/256x256@2/apps/com.plexamp.Plexamp.png

      # AppStream metadata
      - install -Dm644 com.plexamp.Plexamp.metainfo.xml /app/share/metainfo/com.plexamp.Plexamp.metainfo.xml

    sources:
      - type: file
        path: com.plexamp.Plexamp.metainfo.xml

      # One AppImage per architecture, both landing as Plexamp.AppImage, so the
      # build commands above never learn which one they got. They do not need
      # to: the two archives have identical layouts, down to all sixteen BASS
      # plug-ins and the cacert path.
      - type: file
        url: https://plexamp.plex.tv/desktop/Plexamp-4.50.13-x86_64.AppImage
        dest-filename: Plexamp.AppImage
        sha256: 346265acea589a31d5e1add252c83a4ca6ccd632f7718ff083e2f4aa1490c8e7
        only-arches: [x86_64]
        x-checker-data:
          type: json
          is-main-source: true
          url: https://plexamp.plex.tv/desktop/tauri-update.json
          version-query: .version
          url-query: .platforms["linux-x86_64"].url
          timestamp-query: .pub_date

      # No is-main-source here: exactly one source may claim it, and the x86_64
      # entry is the one whose version the checker reports and writes into the
      # update commit. This entry is still checked and still bumped, it just
      # does not get a vote on what the release is called.
      - type: file
        url: https://plexamp.plex.tv/desktop/Plexamp-4.50.13-aarch64.AppImage
        dest-filename: Plexamp.AppImage
        sha256: 7b8de699012b1b2a3bb4d5eb25adf55032a3f5c2125896fc690c38264153b272
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://plexamp.plex.tv/desktop/tauri-update.json
          version-query: .version
          url-query: .platforms["linux-aarch64"].url
          timestamp-query: .pub_date
